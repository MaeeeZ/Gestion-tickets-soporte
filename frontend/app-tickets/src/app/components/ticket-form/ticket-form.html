<h3 style="margin-top: 10px;">{{ esEdicion ? 'Editar Ticket #' + ticket.id : 'Registrar Nuevo Ticket' }}</h3>

<div *ngIf="errorMensaje" style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
  {{ errorMensaje }}
</div>

<form (ngSubmit)="guardarTicket()" style="display: flex; flex-direction: column; gap: 15px; max-width: 500px; background-color: white; padding: 20px; border: 1px solid #ddd; border-radius: 5px;">
  <div>
    <label style="font-weight: bold;">Asunto (*):</label>
    <input type="text" [(ngModel)]="ticket.asunto" name="asunto" required style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
  </div>

  <div>
    <label style="font-weight: bold;">Solicitante (*):</label>
    <input type="text" [(ngModel)]="ticket.solicitante" name="solicitante" required style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
  </div>

  <div>
    <label style="font-weight: bold;">Descripción del Problema (*):</label>
    <textarea [(ngModel)]="ticket.descripcion" name="descripcion" required style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;" rows="4"></textarea>
  </div>

  <div>
    <label style="font-weight: bold;">Categoría:</label>
    <select [(ngModel)]="ticket.categoria" name="categoria" style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
      <option value="Hardware">Hardware</option>
      <option value="Software">Software</option>
      <option value="Redes">Redes</option>
      <option value="Sistemas">Sistemas</option>
    </select>
  </div>

  <div>
    <label style="font-weight: bold;">Prioridad:</label>
    <select [(ngModel)]="ticket.prioridad" name="prioridad" style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
      <option value="Baja">Baja</option>
      <option value="Media">Media</option>
      <option value="Alta">Alta</option>
    </select>
  </div>

  <div>
    <label style="font-weight: bold;">Estado:</label>
    <select [(ngModel)]="ticket.estado" name="estado" style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
      <option value="Abierto">Abierto</option>
      <option value="En Proceso">En Proceso</option>
      <option value="Cerrado">Cerrado</option>
    </select>
  </div>

  <div style="margin-top: 10px;">
    <button type="submit" style="background-color: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px;">
      Guardar Ticket
    </button>
    <a routerLink="/tickets" style="text-decoration: none; color: #555;">Cancelar</a>
  </div>
</form>
