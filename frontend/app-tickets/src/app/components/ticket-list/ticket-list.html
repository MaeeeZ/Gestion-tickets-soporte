<h3 style="margin-top: 10px;">Listado de Solicitudes de Soporte</h3>

<div *ngIf="errorMensaje" style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
  {{ errorMensaje }}
</div>

<table style="width: 100%; border-collapse: collapse; margin-top: 10px; background-color: white; border: 1px solid #ddd;">
  <thead>
    <tr style="background-color: #f2f2f2; text-align: left;">
      <th style="padding: 10px; border: 1px solid #ddd;">ID</th>
      <th style="padding: 10px; border: 1px solid #ddd;">Asunto</th>
      <th style="padding: 10px; border: 1px solid #ddd;">Solicitante</th>
      <th style="padding: 10px; border: 1px solid #ddd;">Categoría</th>
      <th style="padding: 10px; border: 1px solid #ddd;">Prioridad</th>
      <th style="padding: 10px; border: 1px solid #ddd;">Estado</th>
      <th style="padding: 10px; border: 1px solid #ddd;">Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let t of tickets">
      <td style="padding: 10px; border: 1px solid #ddd;">{{ t.id }}</td>
      <td style="padding: 10px; border: 1px solid #ddd;"><strong>{{ t.asunto }}</strong></td>
      <td style="padding: 10px; border: 1px solid #ddd;">{{ t.solicitante }}</td>
      <td style="padding: 10px; border: 1px solid #ddd;">{{ t.categoria }}</td>
      <td style="padding: 10px; border: 1px solid #ddd;">
        <span [style.color]="t.prioridad === 'Alta' ? '#c0392b' : t.prioridad === 'Media' ? '#d35400' : '#27ae60'" style="font-weight: bold;">
          {{ t.prioridad }}
        </span>
      </td>
      <td style="padding: 10px; border: 1px solid #ddd;">
        <span [style.background-color]="t.estado === 'Abierto' ? '#e74c3c' : t.estado === 'En Proceso' ? '#f39c12' : '#2ecc71'" 
              style="color: white; padding: 4px 8px; border-radius: 3px; font-size: 12px; font-weight: bold;">
          {{ t.estado }}
        </span>
      </td>
      <td style="padding: 10px; border: 1px solid #ddd;">
        <a [routerLink]="['/tickets/editar', t.id]" style="margin-right: 10px; color: #2980b9; text-decoration: none; font-weight: bold;">Editar</a>
        <button (click)="eliminarTicket(t.id!)" style="background-color: #c0392b; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">Eliminar</button>
      </td>
    </tr>
    <tr *ngIf="tickets.length === 0">
      <td colspan="7" style="padding: 15px; text-align: center; color: #777;">No hay tickets registrados en la base de datos.</td>
    </tr>
  </tbody>
</table>
