<h3 style="margin-top: 10px;">Listado de Solicitudes de Soporte</h3>

<div *ngIf="errorMensaje" style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
  {{ errorMensaje }}
</div>

<table style="width: 100%; border-collapse: collapse; margin-top: 10px; background-color: white;">
  <thead>
    <tr style="background-color: #f2f2f2; text-align: left;">
      <th style="padding: 10px; border: 1px solid #ddd;">ID</th>
      <th style="padding: 10px; border: 1px solid #ddd;">Asunto</th>
      <th style="padding: 10px; border: 1px solid #ddd;">Solicitante</th>
      <th style="padding: 10px; border: 1px solid #ddd;">Categoría</th>
      <th style="padding: 10px; border: 1px solid #ddd;">Prioridad</th>
      <th style="padding: 10px; border: 1px solid #ddd;">Estado</th>
      <th style="padding: 10px; border: 1px solid #ddd;">Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let ticket of tickets">
      <td style="padding: 10px; border: 1px solid #ddd;">{{ ticket.id }}</td>
      <td style="padding: 10px; border: 1px solid #ddd;"><strong>{{ ticket.asunto }}</strong></td>
      <td style="padding: 10px; border: 1px solid #ddd;">{{ ticket.solicitante }}</td>
      <td style="padding: 10px; border: 1px solid #ddd;">{{ ticket.categoria }}</td>
      <td style="padding: 10px; border: 1px solid #ddd;">
        <span [style.color]="ticket.prioridad === 'Alta' ? '#c0392b' : ticket.prioridad === 'Media' ? '#d35400' : '#27ae60'" style="font-weight: bold;">
          {{ ticket.prioridad }}
        </span>
      </td>
      <td style="padding: 10px; border: 1px solid #ddd;">
        <span [style.background-color]="ticket.estado === 'Abierto' ? '#e74c3c' : ticket.estado === 'En Proceso' ? '#f39c12' : '#2ecc71'" 
              style="color: white; padding: 4px 8px; border-radius: 3px; font-size: 12px; font-weight: bold;">
          {{ ticket.estado }}
        </span>
      </td>
      <td style="padding: 10px; border: 1px solid #ddd;">
        <a [routerLink]="['/tickets/editar', ticket.id]" style="margin-right: 10px; color: #2980b9; text-decoration: none; font-weight: bold;">Editar</a>
        <button (click)="eliminarTicket(ticket.id!)" style="background-color: #c0392b; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>
